[package]
name = "igris-ai"
version = "0.1.0"
edition = "2021"
description = "IGRIS voice assistant intelligence core (STT/TTS/VAD/wake word, NLU, online reasoning) shared by IGRIS desktop companions."

[lib]
name = "igris_ai"
crate-type = ["lib"]

[dependencies]
# ---- async runtime ----
tokio = { version = "1", features = ["full"] }

# ---- serialization ----
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ---- assistant engines ----
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
lazy_static = "1.4"
sherpa-onnx = "1.11"
cpal = "0.16"
rodio = "0.17"
once_cell = "1.19"
regex = "1.10"
num-complex = "0.4"
rustfft = "6.1"

# ---- online (NVIDIA NIM) STT + reasoning ----
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
reqwest = { version = "0.11", features = ["stream", "json", "blocking"] }
futures = "0.3"
dirs = "5"

[build-dependencies]
tonic-build = "0.12"
protoc-bin-vendored = "3"

[features]
# Generates + compiles the NVIDIA Riva gRPC client (online STT). Requires
# the riva proto tree from the desktop companion (../igris-ecosystem/proto).
default = []
with_riva = []
