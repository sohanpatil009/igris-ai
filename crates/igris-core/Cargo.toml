[package]
name = "igris-core"
version = "0.1.0"
edition = "2024"

[dependencies]
moonshine-rs = "0.2.9"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
cpal = "0.18.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
